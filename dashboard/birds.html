<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birds Data - Imo Quality</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  

  
    <!-- CSS -->
  <link rel="stylesheet" href="../css/sidebar.css?v=3" />
  <link rel="stylesheet" href="../css/dashboard.css?v=2" />
  <link rel="stylesheet" href="../css/birds.css" />
  <link rel="stylesheet" href="../css/professional.css?v=23" />
  <link rel="stylesheet" href="../css/preview-modal.css?v=2" />
</head>
<body class="dashboard-body">

  <div class="dashboard-layout">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="main-content">

<header class="page-header">
  <div class="page-header-text">
    <h1>BIRDS HANGING TIME</h1>
    <p>Hanging Time Records</p>
  </div>
  <div class="header-actions">
    <label class="switch" title="Theme">
      <input type="checkbox" id="themeToggle" />
      <span class="slider">
        <div class="star star_1"></div>
        <div class="star star_2"></div>
        <div class="star star_3"></div>
        <svg viewBox="0 0 16 16" class="cloud_1 cloud">
          <path transform="matrix(.77976 0 0 .78395-299.99-418.63)" fill="#fff" d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925"></path>
        </svg>
      </span>
    </label>
    <button class="Btn" id="sidebarLogout" type="button">
      <div class="sign"><svg viewBox="0 0 512 512"><path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"></path></svg></div>
      <div class="text">Logout</div>
    </button>
  </div>
</header>

      <!-- Filter Section -->
      <div class="filter-section">
        <div class="form-group">
          <label for="birdDate">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Select Date <span class="required">*</span>
          </label>
          <input type="date" id="birdDate" name="birdDate" required />
        </div>
      </div>

      <!-- Birds Data Section -->
      <div class="birds-data-section">

        <!-- Empty state -->
        <div class="birds-empty" id="birdsEmpty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <p>Select a date above to load batch data</p>
        </div>

        <!-- Loading state -->
        <div class="birds-loading" id="birdsLoading" style="display: none;">
          <div class="loading-spinner"></div>
          <p>Loading batches...</p>
        </div>

        <!-- Batches table -->
        <div class="birds-table-wrap" id="birdsTableWrap" style="display: none;">
          
          <!-- Scrollable Table Area -->
          <div class="birds-table-scroll">
            <table class="birds-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Load No</th>
                  <th>Farmer</th>
                  <th>Batch No</th>
                  <th>Birds Qty</th>
                  <th>Hanging Time</th>
                </tr>
              </thead>
              <tbody id="birdsTableBody"></tbody>
            </table>
          </div>

          <!-- Save button -->
          <div class="birds-actions">
            <button type="button" class="btn-save-birds" id="saveBirdsBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              Save  
            </button>
          </div>

        </div>

      </div>

    </main>

  </div>

  <!-- JS -->
  <script src="../js/input-feedback.js?v=1"></script>
  <script src="../js/users.js?v=3"></script>
  <script src="../js/sidebar.js?v=20"></script>
  <script src="../js/preview-modal.js?v=3"></script>
  <script src="../js/birds.js?v=3"></script>

</body>
</html>
