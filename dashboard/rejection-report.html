<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>In-Process Rejection Report - Imo Quality</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/sidebar.css?v=8" />
  <link rel="stylesheet" href="../css/dashboard.css?v=2" />
  <link rel="stylesheet" href="../css/professional.css?v=16" />
  <link rel="stylesheet" href="../css/bq-report.css" />
  <link rel="stylesheet" href="../css/water-report.css" />
  <link rel="stylesheet" href="../css/rejection-report.css" />
  <link rel="stylesheet" href="../css/report-pro.css?v=3" />
  <link rel="stylesheet" href="../css/report-clean.css?v=3" />
  <link rel="stylesheet" href="../css/report-common.css?v=12" />
  <link rel="stylesheet" href="../css/mobile-responsive.css?v=4" />
</head>
<body class="dashboard-body report-page">

  <div class="dashboard-layout">

    <div id="sidebar-container"></div>

    <main class="main-content">

      <header class="page-header">
        <div class="page-header-text">
          <h1>IN-PROCESS REJECTION REPORT</h1>
          <p>Monthly In-Process Rejection Record</p>
        </div>
        <div class="header-actions">
          <div class="header-datetime">
            <div class="header-date">-</div>
            <div class="header-sep"></div>
            <div class="header-time">-</div>
          </div>
          <label class="switch" title="Theme">
            <input type="checkbox" id="themeToggle" />
            <span class="slider">
              <div class="star star_1"></div>
              <div class="star star_2"></div>
              <div class="star star_3"></div>
              <svg viewBox="0 0 16 16" class="cloud_1 cloud">
                <path transform="matrix(.77976 0 0 .78395-299.99-418.63)" fill="#fff" d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925"></path>
              </svg>
            </span>
          </label>
          <button class="Btn" id="sidebarLogout" type="button">
            <div class="sign"><svg viewBox="0 0 512 512"><path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"></path></svg></div>
            <div class="text">Logout</div>
          </button>
        </div>
      </header>

      <div class="filter-section rj-filter-section">
        <div class="rj-report-tabs" role="tablist" aria-label="Report view">
          <button type="button" class="active" data-rj-view="daily" role="tab" aria-selected="true">Day-wise</button>
          <button type="button" data-rj-view="item" role="tab" aria-selected="false">Item-wise</button>
          <button type="button" data-rj-view="month" role="tab" aria-selected="false">Month-wise</button>
        </div>

        <div class="rj-report-filters">
          <div id="rjSingleMonthGroup">
            <div class="form-group">
              <label for="reportMonth">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                SELECT MONTH <span class="required">*</span>
              </label>
              <input type="month" id="reportMonth" />
            </div>
          </div>

          <div class="rj-month-range" id="rjMonthRange" hidden>
            <div class="form-group">
              <label for="rjFromMonth">FROM MONTH</label>
              <input type="month" id="rjFromMonth" />
            </div>
            <div class="form-group">
              <label for="rjToMonth">TO MONTH</label>
              <input type="month" id="rjToMonth" />
            </div>
          </div>

          <button class="btn-report-load" id="loadReportBtn" type="button">LOAD REPORT</button>        <div class="report-export-wrap">
          <button class="report-export-trigger" type="button" aria-label="Export report" aria-expanded="false" title="Export options">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15V3"></path>
              <path d="m7 8 5-5 5 5"></path>
              <path d="M5 21h14"></path>
            </svg>
          </button>
          <div class="report-export-menu" role="menu" hidden>
            <button type="button" role="menuitem" class="report-export-option"><span aria-hidden="true">↑</span> Export PDF</button>
            <button type="button" role="menuitem" class="report-export-option"><span aria-hidden="true">↑</span> Export CSV</button>
          </div>
        </div>
        </div>
      </div>

      <div id="reportArea" class="report-area">

        <div class="birds-empty" id="reportEmpty">
          <p>Select a month above to generate the report</p>
        </div>

        <div class="birds-loading" id="reportLoading" style="display:none">
          <div class="loading-spinner"></div>
          <p>Loading report data...</p>
        </div>

        <div id="reportSheet" class="report-sheet" style="display:none">
          <div class="report-title-row">
            <div class="report-date-batch">
              <span><strong>Period:</strong> <span id="rptMonth">&mdash;</span></span>
              <span><strong>Records:</strong> <span id="rptCount">0</span></span>
              <span><strong>Total:</strong> <span id="rptTotal">0</span></span>
            </div>
            <div class="report-main-title">In-Process Rejection Report</div>
            <div></div>
          </div>

<div class="rj-month-layout" id="rjMonthLayout">
  <div class="wp-table-wrap rj-wrap">
    <table class="wp-table rj-table">
      <thead id="reportHead">
        <tr><th>Date</th><th>Item</th><th>Qty (kg)</th><th>Remark</th></tr>
      </thead>
      <tbody id="reportBody"></tbody>
      <tfoot id="reportFoot"></tfoot>
    </table>
  </div>

  <div class="rj-month-chart" id="rjMonthChart" hidden></div>
</div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/users.js"></script>
  <script src="../js/sidebar.js?v=23"></script>
  <script src="../js/report-cache.js"></script>
  <script>
    window.RJ_REPORT = {
      type: 'inprocess',
      title: 'In-Process Rejection Report',
      file: 'In-Process-Rejection-Report',
      remark: true
    };
  </script>
  <script src="../js/rejection-report.js?v=4"></script>
  <script src="../js/report-export-menu.js?v=1"></script>
  <script src="../js/report-export-actions.js?v=7"></script>
  <script src="../js/footer-ticker.js?v=7"></script>
</body>
</html>
