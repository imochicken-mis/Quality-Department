<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Complaint Report</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/sidebar.css?v=9" />
  <link rel="stylesheet" href="../css/dashboard.css?v=2" />
  <link rel="stylesheet" href="../css/professional.css?v=16" />
  <link rel="stylesheet" href="../css/bq-report.css" />
  <link rel="stylesheet" href="../css/master-report.css" />
  <link rel="stylesheet" href="../css/report-pro.css?v=3" />
  <link rel="stylesheet" href="../css/report-clean.css?v=3" />
  <link rel="stylesheet" href="../css/customer-complaint-report.css" />
  <link rel="stylesheet" href="../css/report-common.css?v=12" />
  <link rel="stylesheet" href="../css/mobile-responsive.css?v=4" />
</head>
<body class="dashboard-body report-page">
  <div class="dashboard-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="page-header">
        <div class="page-header-text">
          <h1>Customer Complaint Report</h1>
          <p>Customer Complaint Summary</p>
        </div>
      </header>

      <div class="filter-section">
        <div class="form-group">
          <label for="fromDate">FROM DATE</label>
          <input type="date" id="fromDate">
        </div>

        <div class="form-group">
          <label for="toDate">TO DATE</label>
          <input type="date" id="toDate">
        </div>

        <button class="btn-report-load" id="loadReportBtn" type="button">
           LOAD REPORT
        </button>        <div class="report-export-wrap">
          <button class="report-export-trigger" type="button" aria-label="Export report" aria-expanded="false" title="Export options">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15V3"></path>
              <path d="m7 8 5-5 5 5"></path>
              <path d="M5 21h14"></path>
            </svg>
          </button>
          <div class="report-export-menu" role="menu" hidden>
            <button type="button" role="menuitem" class="report-export-option"><span aria-hidden="true">↑</span> Export PDF</button>
            <button type="button" role="menuitem" class="report-export-option"><span aria-hidden="true">↑</span> Export CSV</button>
          </div>
        </div>
      </div>

      <div class="birds-loading" id="reportLoading" style="display:none">
        <div class="loading-spinner"></div>
        <p>Loading report...</p>
      </div>

      <div class="birds-empty" id="reportEmpty">
        <p>Select a date range and click Load Report.</p>
      </div>

      <div class="report-sheet mr-table-wrap" id="reportTableWrap" style="display:none">
        <table class="mr-table customer-complaint-report-table">
          <thead>
            <tr>
              <th>Se.No</th>
              <th>Date</th>
              <th>Received Date</th>
              <th>Received From</th>
              <th>
              <div class="category-heading">
                <span>Complaint Category</span>
                <label class="category-filter-icon" title="Filter complaint category">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 5h16l-6.4 7.2V18l-3.2 1v-6.8L4 5z"></path>
                  </svg>
                  <select id="complaintCategoryFilter" aria-label="Filter complaint category">
                    <option value="">All categories</option>
                    <option value="Others">Others</option>
                    <option value="Food Safety">Food Safety</option>
                  </select>
                </label>
              </div>
            </th>
              <th>Customer</th>
              <th>Customer Complaint</th>
              <th>Item QTY (kg)</th>
              <th>Complaint + sample + CC sheet</th>
              <th>Complaint + sample</th>
              <th>Complaint</th>
            </tr>
          </thead>
          <tbody id="reportBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/users.js"></script>
  <script src="../js/sidebar.js?v=25"></script>
  <script src="../js/customer-complaint-report.js"></script>
  <script src="../js/report-export-menu.js?v=1"></script>
  <script src="../js/report-export-actions.js?v=7"></script>
  <script src="../js/footer-ticker.js?v=7"></script>
</body>
</html>
