<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operational Inspection Report - Imo Quality</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/sidebar.css?v=4" />
  <link rel="stylesheet" href="../css/dashboard.css?v=2" />
  <link rel="stylesheet" href="../css/professional.css?v=16" />
  <link rel="stylesheet" href="../css/report-pro.css?v=3" />
  <link rel="stylesheet" href="../css/report-clean.css?v=3" />
  <link rel="stylesheet" href="../css/operational-inspection.css?v=19" />
  <link rel="stylesheet" href="../css/operational-inspection-report.css?v=14" />
  <link rel="stylesheet" href="../css/report-common.css?v=12" />
</head>
<body class="dashboard-body report-page">
  <div class="dashboard-layout">
    <div id="sidebar-container"></div>
    <main class="main-content">
      <header class="page-header">
        <div class="page-header-text">
          <h1>Operational Inspection Report</h1>
          <p>View saved Pre-Operational, Operational and Post-Operational checklists by date and division</p>
        </div>
        <div class="header-actions">
          <label class="switch" title="Theme">
            <input type="checkbox" id="themeToggle" />
            <span class="slider"><div class="star star_1"></div><div class="star star_2"></div><div class="star star_3"></div><svg viewBox="0 0 16 16" class="cloud_1 cloud"><path transform="matrix(.77976 0 0 .78395-299.99-418.63)" fill="#fff" d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925"></path></svg></span>
          </label>
          <button class="Btn" id="sidebarLogout" type="button"><div class="sign"><svg viewBox="0 0 512 512"><path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"></path></svg></div><div class="text">Logout</div></button>
        </div>
      </header>

      <section class="filter-section operational-report-filter">
        <div class="inspection-tabs operational-report-tabs" role="tablist" aria-label="Inspection stage">
          <button type="button" class="inspection-tab active" id="reportPreTab" role="tab" aria-selected="true" data-stage="Pre-Operational">Pre-Operational</button>
          <button type="button" class="inspection-tab" id="reportOperationalTab" role="tab" aria-selected="false" data-stage="Operational">Operational</button>
          <button type="button" class="inspection-tab" id="reportPostTab" role="tab" aria-selected="false" data-stage="Post-Operational">Post-Operational</button>
        </div>

        <div class="inspection-meta operational-report-controls">
          <div class="form-group">
            <label for="reportDate">SELECT DATE <span class="required">*</span></label>
            <input type="date" id="reportDate" />
          </div>
          <div class="form-group">
            <label for="reportDivision">SELECT DIVISION <span class="required">*</span></label>
            <select id="reportDivision">
              <option value="">Select division</option>
              <option value="Live Bird">Live Bird</option>
              <option value="Slaughter">Slaughter</option>
              <option value="EV">EV</option>
              <option value="Packing">Packing</option>
              <option value="Easy">Easy</option>
              <option value="Cold Storage">Cold Storage</option>
              <option value="Finished Good">Finished Good</option>
            </select>
          </div>
          <button class="btn-report-load" id="loadInspectionReportBtn" type="button" style="appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 24px;border:0;border-radius:10px;background:#251c5f;color:#fff;font:700 13px Inter,Segoe UI,sans-serif;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;box-shadow:none">LOAD REPORT</button>        <div class="report-export-wrap">
          <button class="report-export-trigger" type="button" aria-label="Export report" aria-expanded="false" title="Export options">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15V3"></path>
              <path d="m7 8 5-5 5 5"></path>
              <path d="M5 21h14"></path>
            </svg>
          </button>
          <div class="report-export-menu" role="menu" hidden>
            <button type="button" role="menuitem" class="report-export-option" data-export-pdf="inspection"><span aria-hidden="true">↑</span> Export PDF</button>
            <button type="button" role="menuitem" class="report-export-option"><span aria-hidden="true">↑</span> Export CSV</button>
          </div>
        </div>
        </div>
      </section>

      <div class="birds-empty operational-report-empty" id="reportEmpty"><p>Select a date and division, then click Load Report.</p></div>

      <div class="inspection-report-body" id="reportBody" hidden>
          <p class="inspection-report-meta" id="reportMeta"></p>
          <div class="inspection-table-wrap">
            <table class="inspection-table inspection-report-table">
              <thead>
                <tr><th>No</th><th>Check Point</th><th class="report-criteria-col">Acceptance Criteria</th><th class="col-status">Status</th><th>Action Taken / Remark</th></tr>
              </thead>
              <tbody id="reportRows"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="../js/users.js"></script>
  <script src="../js/sidebar.js?v=21"></script>
  <script src="../js/operational-inspection-report.js?v=3"></script>
  <script src="../js/report-export-menu.js?v=1"></script>
  <script src="../js/report-export-actions.js?v=7"></script>
  <script src="../js/operational-inspection-report-pdf.js?v=2"></script>
  <script src="../js/footer-ticker.js?v=7"></script>
</body>
</html>
